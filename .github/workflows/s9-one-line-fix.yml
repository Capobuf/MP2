name: S9 One Line Fix

on:
  push:
    branches:
      - spec/s9-closing

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Remove redundant instanceof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Actions/Closing/ReviewExerciseClosing.php')
          text = p.read_text()
          old = 'if ($candidate !== $currentState && $currentState instanceof ProjectState) {'
          new = 'if ($candidate !== $currentState) {'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one occurrence, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git diff --check
          git add app/Actions/Closing/ReviewExerciseClosing.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remove redundant ProjectState check"
          git push origin HEAD:spec/s9-closing
